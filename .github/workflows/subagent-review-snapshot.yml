name: Subagent integration snapshot
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/subagent-review-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/subagent-lifecycle-reset'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: tar --exclude=.git --exclude=dist --exclude=node_modules -czf "$RUNNER_TEMP/subagent-review-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: subagent-review-source
          path: ${{ runner.temp }}/subagent-review-source.tar.gz
          retention-days: 1
