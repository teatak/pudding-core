name: Subagent development source snapshot
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/subagent-dev-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive source only
        run: tar --exclude=.git --exclude=node_modules --exclude=dist -czf "$RUNNER_TEMP/pudding-core-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: pudding-core-source
          path: ${{ runner.temp }}/pudding-core-source.tar.gz
          retention-days: 1
