name: Core CI
on:
  push:
    branches: [main, codex/windows-x64]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: brew install portaudio cmake pkgconf
      - name: Prepare pinned Abseil for the arm64 audio bridge
        run: |
          bash scripts/prepare-abseil.sh
          echo "PKG_CONFIG_PATH=$PWD/dist/deps/abseil/lib/pkgconfig" >> "$GITHUB_ENV"
      - run: make test
      - run: make schema-check
      - run: make daemon
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/scan-secrets.cjs
  windows-x64:
    runs-on: windows-latest
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '1'
      CC: gcc
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          architecture: x64
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Verify x64 CGO toolchain
        run: |
          go env GOOS GOARCH CGO_ENABLED CC
          gcc -dumpmachine
          test "$(go env GOARCH)" = amd64
          test "$(gcc -dumpmachine)" = x86_64-w64-mingw32
          pwsh.exe -NoLogo -NoProfile -NonInteractive -Command 'if ($PSVersionTable.PSVersion.Major -lt 7 -or [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne "X64") { exit 1 }; $PSVersionTable.PSVersion.ToString()'
      - run: make daemon BUILDTAGS=sqlite_fts5 DAEMON_OUT=bin/puddingd.exe
        id: daemon-build
      - name: Verify native PowerShell and command lifecycle
        run: go test -count=1 -tags sqlite_fts5 ./internal/tool -run '^(TestPowerShell|TestWindows|TestCommandRun(UsesProjectCWDAndCapturesOutput|StreamsStdoutAndStderr|ReturnsExitCode|TimeoutKillsProcessTree|StopsOnContextCancel)|TestBackgroundProcess(StartPollStop|PipeAcceptsInput|RunsAndStopsLocalServer))'
      - run: make test BUILDTAGS=sqlite_fts5
        if: ${{ !cancelled() && steps.daemon-build.outcome == 'success' }}
      - run: make schema-check BUILDTAGS=sqlite_fts5
        if: ${{ !cancelled() && steps.daemon-build.outcome == 'success' }}
