name: Core CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: brew install portaudio cmake pkgconf
      - name: Prepare pinned Abseil for the arm64 audio bridge
        run: |
          bash scripts/prepare-abseil.sh
          echo "PKG_CONFIG_PATH=$PWD/dist/deps/abseil/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Run make test
        run: |
          set +e
          make test > "$RUNNER_TEMP/core-tests.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            grep -B 20 -A 20 -E -- '--- FAIL:|^panic:|^fatal error:|^# github|^.*\.go:[0-9]+:[0-9]+:|^FAIL[[:space:]]' "$RUNNER_TEMP/core-tests.log" | head -400 || true
          fi
          tail -30 "$RUNNER_TEMP/core-tests.log"
          exit "$status"
      - name: Verify file safety and verification regressions
        run: go test -count=1 -v -tags "sqlite_fts5 webrtcaec" ./internal/turnfiles ./internal/tool -run '^(TestTrackerUnreadableBaselineCannotDeleteOriginalOnUndo|TestReplayerRejectsIncompleteExistingSnapshots|TestFilePatchRejectsApprovalPermissionDrift|TestGitStageRetainsBuiltInNormalization|TestGitStageNormalizesWithoutExternalFilters|TestGitStagePreservesLiteralSymlinkTarget|TestCommandMakeIgnoredErrorsDoNotClaimPass)$'
      - name: Verify language-service cancellation and lifecycle races
        run: go test -count=1 -v -race ./internal/lsp
      - run: make schema-check
      - run: make daemon
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare bundled language servers
        run: |
          make language-servers
          echo "$PWD/bin/language-servers" >> "$GITHUB_PATH"
      - name: Verify real Go and TypeScript language servers
        env:
          PUDDING_LSP_INTEGRATION: '1'
          PUDDING_LSP_TS_INTEGRATION: '1'
        run: go test -count=1 -v -tags "sqlite_fts5 webrtcaec" ./internal/tool -run '^TestCode'
      - run: node scripts/scan-secrets.cjs
