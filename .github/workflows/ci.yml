name: Core CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: brew install portaudio cmake pkgconf
      - name: Prepare pinned Abseil for the arm64 audio bridge
        run: |
          bash scripts/prepare-abseil.sh
          echo "PKG_CONFIG_PATH=$PWD/dist/deps/abseil/lib/pkgconfig" >> "$GITHUB_ENV"
      - run: make test
      - run: make schema-check
      - run: make daemon
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/scan-secrets.cjs
