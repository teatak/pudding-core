<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pudding Core</title>
    <script>
      // 首屏防闪:在 CSS/JS 之前同步定好主题,避免暗黑模式启动闪白。
      // color-scheme + html/body/#root fallback 让浏览器默认底色即为深色。
      // 逻辑须与 src/theme/theme.ts 一致(key=pudding.theme;非 light/dark 即跟随系统)。
      (function () {
        try {
          var t = localStorage.getItem("pudding.theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var dark = t === "dark";
          var bg = dark ? "oklch(0.205 0 0)" : "oklch(1 0 0)";
          var fg = dark ? "oklch(0.95 0 0)" : "oklch(0.18 0 0)";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = t;
          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.color = fg;
          var style = document.createElement("style");
          style.id = "pudding-theme-fallback";
          style.textContent = "html,body,#root{background:" + bg + ";color:" + fg + ";}";
          document.head.appendChild(style);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
