<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pudding Core</title>
    <script>
      // 首屏防闪:在 CSS/JS 之前同步定好主题,避免暗黑模式启动闪白。
      // color-scheme 让浏览器默认底色即为深色(连 CSS 加载前那帧也不白)。
      // 逻辑须与 src/theme/theme.ts 一致(key=pudding.theme;非 light/dark 即跟随系统)。
      (function () {
        try {
          var t = localStorage.getItem("pudding.theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
