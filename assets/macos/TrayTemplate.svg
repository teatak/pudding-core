<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -4 27 27" role="img" aria-label="pudding tray icon">
  <!-- viewBox 从 22×22 扩到 27×27,logo 居中,在 viewBox 内 width 占比从 87%
       缩到 71%,视觉总共缩约 18%(macOS HIG menu bar tray icon 推荐区间)。
       logo 内部坐标 (1.35-20.65 范围) 完全不动,只 viewport 扩大让 padding 出
       现在四周。
       起点 (-3, -4) 让 logo center (11, 9.65) 大致落在 viewBox center (10.5, 9.5),
       offset 0.5 单位在渲染下视觉可忽略。 -->
  <defs>
    <mask id="cutouts">
      <rect x="-3" y="-4" width="27" height="27" fill="#fff"/>
      <rect x="7.1" y="10" width="2.5" height="1.5" rx="0.45" fill="#000"/>
      <rect x="12.4" y="10" width="2.5" height="1.5" rx="0.45" fill="#000"/>
      <path d="M9.8 15 Q11 15.15 12.2 15" fill="none" stroke="#000" stroke-width="0.9" stroke-linecap="round"/>
    </mask>
  </defs>
  <g fill="#000" stroke="#000" stroke-linecap="round" stroke-linejoin="round" mask="url(#cutouts)">
    <path d="M11 5.2 C11.08 4.3 10.95 3.45 10.68 2.75" fill="none" stroke-width="1"/>
    <circle cx="10.6" cy="2.35" r="0.85"/>
    <path d="M4.25 12.9 Q2.35 14.25 1.35 16.35" fill="none" stroke-width="1.25"/>
    <path d="M17.75 12.9 Q19.65 14.25 20.65 16.35" fill="none" stroke-width="1.25"/>
    <circle cx="1.35" cy="16.35" r="0.9"/>
    <circle cx="20.65" cy="16.35" r="0.9"/>
    <rect x="3.6" y="5.2" width="14.8" height="12.6" rx="4.1"/>
  </g>
</svg>
